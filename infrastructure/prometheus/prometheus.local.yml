# ==============================================================================
# SentinelOps Prometheus Configuration — Local Host Standalone Mode
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          instance: "sentinelops-prometheus"
          service: "prometheus-server"

  - job_name: "windows_exporter"
    scrape_interval: 10s
    scrape_timeout: 8s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:9182"]
        labels:
          instance: "windows-host"
          environment: "local-host"
          collector: "windows_exporter"
